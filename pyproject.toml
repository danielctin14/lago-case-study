[project]
name = "lago-case"
version = "0.1.0"
description = "Lago Solutions Engineer case study: SaaSCo duplicate-charge diagnosis and Stripe-to-Lago migration"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "lago-python-client>=1.57.0",
    "python-dotenv>=1.2.4",
    "stripe>=17.0.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
